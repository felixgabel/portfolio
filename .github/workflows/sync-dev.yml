name: Sync dev with main

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: dev

      # Fails (instead of overwriting anything) if dev has commits main lacks
      - name: Fast-forward dev to main
        run: |
          git merge --ff-only origin/main
          git push origin dev
